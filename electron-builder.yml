appId: dev.desktop-assistant.app
productName: Lumi
directories:
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
# Lumi's local AI engines (fetched and checksum-verified by `npm run runtimes`) and the desktop helper script.
extraResources:
  - from: resources/runtimes
    to: runtimes
  - from: resources/scripts
    to: scripts
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
