appId: dev.desktop-assistant.app
productName: Lumi
directories:
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
